<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cultural Studies — 10-Week Exam, Quiz & Master Textbook Portal</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Header Navigation -->
    <header class="app-header">
        <div class="header-container">
            <div class="logo">
                <span class="badge">AITU</span>
                <h1 id="app-logo-title">Cultural Studies <span>Portal</span></h1>
            </div>

            <!-- Instant Language Toggle (No Reload) -->
            <div class="lang-toggle-container">
                <button class="lang-btn active" id="lang-ru" onclick="switchLanguage('ru')">🇷🇺 RU</button>
                <button class="lang-btn" id="lang-en" onclick="switchLanguage('en')">🇬🇧 EN</button>
            </div>

            <!-- Scalable 10-Week Navigation Hub -->
            <div class="week-nav-hub">
                <label for="week-select-dropdown" class="hub-label" id="lbl-select-week">Select Week:</label>
                <select id="week-select-dropdown" class="hub-select" onchange="switchWeek(this.value)">
                    <option value="1" selected>⚡ Week 1: Morphology & Language</option>
                    <option value="2">🎯 Week 2: Semiotics & Anatomy</option>
                    <option value="3" disabled>🔒 Week 3 (Upcoming)</option>
                    <option value="4" disabled>🔒 Week 4 (Upcoming)</option>
                    <option value="5" disabled>🔒 Week 5 (Upcoming)</option>
                    <option value="6" disabled>🔒 Week 6 (Upcoming)</option>
                    <option value="7" disabled>🔒 Week 7 (Upcoming)</option>
                    <option value="8" disabled>🔒 Week 8 (Upcoming)</option>
                    <option value="9" disabled>🔒 Week 9 (Upcoming)</option>
                    <option value="10" disabled>🔒 Week 10 (Upcoming)</option>
                    <option value="all">🔥 Full Course Mega-Test (All Weeks)</option>
                </select>
            </div>

            <!-- Main Mode Navigation Tabs -->
            <nav class="nav-tabs">
                <button class="tab-btn active" id="tab-quiz" onclick="switchMainView('quiz')">
                    <span class="tab-icon">⚡</span> <span id="txt-tab-quiz">Quiz Trainer</span>
                </button>
                <button class="tab-btn highlight-tab" id="tab-main" onclick="switchMainView('main')">
                    <span class="tab-icon">📖</span> <span id="txt-tab-main">Master Textbook (MAIN)</span>
                </button>
            </nav>
        </div>
    </header>

    <!-- Main Container -->
    <main class="main-content">
        <div class="content-wrapper">

            <!-- Controls & Selector Bar (For Quiz Mode) -->
            <div class="control-panel" id="quiz-control-panel">
                <div class="mode-selector">
                    <label for="q-count-select" id="lbl-q-mode">Questions Mode:</label>
                    <select id="q-count-select" onchange="changeQuestionCount(this.value)">
                        <option value="10" selected>10 Questions</option>
                        <option value="30">30 Questions</option>
                        <option value="50">50 Questions</option>
                        <option value="100">100 Questions (Mega Mode)</option>
                    </select>
                </div>
                <button class="reset-btn" id="btn-restart" onclick="resetCurrentQuiz()">🔄 Restart Test</button>
            </div>

            <!-- Stats Bar (For Quiz Mode) -->
            <div class="stats-bar" id="quiz-stats-bar">
                <div class="stat-card">
                    <span class="stat-label" id="lbl-active-test">Active Test</span>
                    <span class="stat-value" id="quiz-title">Week 1: Morphology & Language</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label" id="lbl-score">Score</span>
                    <span class="stat-value highlight" id="score-counter">0 / 10</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label" id="lbl-accuracy">Accuracy</span>
                    <span class="stat-value" id="accuracy-counter">100%</span>
                </div>
            </div>

            <!-- Progress Bar (For Quiz Mode) -->
            <div class="progress-container" id="quiz-progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>

            <!-- Quiz Questions Container -->
            <div class="quiz-container" id="quiz-container">
                <!-- Dynamically populated by JS -->
            </div>

            <!-- Master Study Guide Reader Container (For Main Mode) -->
            <div class="reader-container" id="reader-container" style="display: none;">
                <div class="reader-controls">
                    <button class="reader-btn active" id="btn-read-week1" onclick="loadReaderWeek(1)">📘 Week 1 Master Guide</button>
                    <button class="reader-btn" id="btn-read-week2" onclick="loadReaderWeek(2)">📙 Week 2 Master Guide</button>
                </div>
                <div class="reader-content card-glass" id="reader-text-area">
                    <!-- Master Guide Markdown / HTML dynamically rendered -->
                </div>
            </div>

        </div>
    </main>

    <footer class="app-footer">
        <p>Astana IT University • Cultural Studies 10-Week Scalable Portal • Summer Trimester 2026</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
