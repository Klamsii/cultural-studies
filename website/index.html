<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cultural Studies — Exam & Test Trainer</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Header Navigation -->
    <header class="app-header">
        <div class="header-container">
            <div class="logo">
                <span class="badge">AITU</span>
                <h1>Cultural Studies <span>Test Trainer</span></h1>
            </div>
            <nav class="nav-tabs">
                <button class="tab-btn active" id="tab-week1" onclick="switchWeek(1)">
                    <span class="tab-icon">⚡</span> Week 1 (Morphology)
                </button>
                <button class="tab-btn" id="tab-week2" onclick="switchWeek(2)">
                    <span class="tab-icon">🎯</span> Week 2 (Semiotics)
                </button>
                <button class="tab-btn" id="tab-all" onclick="switchWeek('all')">
                    <span class="tab-icon">🔥</span> Full Course Mega-Test
                </button>
            </nav>
        </div>
    </header>

    <!-- Main Container -->
    <main class="main-content">
        <div class="content-wrapper">

            <!-- Controls & Selector Bar -->
            <div class="control-panel">
                <div class="mode-selector">
                    <label for="q-count-select">Questions Mode:</label>
                    <select id="q-count-select" onchange="changeQuestionCount(this.value)">
                        <option value="10" selected>10 Questions</option>
                        <option value="30">30 Questions</option>
                        <option value="50">50 Questions</option>
                        <option value="100">100 Questions (Mega Mode)</option>
                    </select>
                </div>
                <button class="reset-btn" onclick="resetCurrentQuiz()">🔄 Restart Test</button>
            </div>

            <!-- Stats Bar -->
            <div class="stats-bar">
                <div class="stat-card">
                    <span class="stat-label">Active Test</span>
                    <span class="stat-value" id="quiz-title">Week 1: Morphology & Language</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Score</span>
                    <span class="stat-value highlight" id="score-counter">0 / 10</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Accuracy</span>
                    <span class="stat-value" id="accuracy-counter">100%</span>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>

            <!-- Questions Container -->
            <div class="quiz-container" id="quiz-container">
                <!-- Dynamically populated by JS -->
            </div>

        </div>
    </main>

    <footer class="app-footer">
        <p>Astana IT University • Cultural Studies Exam & Test Trainer • Summer Trimester 2026</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
