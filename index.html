<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cultural Studies — Mobile Optimized Exam & AI Assistant Portal</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="website/css/styles.css?v=20260729_2">
</head>
<body>

    <!-- Premium Glass Header Navigation -->
    <header class="app-header">
        <div class="header-container">
            <!-- Brand Logo -->
            <div class="logo-group">
                <div class="logo-badge">AITU</div>
                <div class="logo-text">
                    <span class="brand-title">Cultural Studies</span>
                    <span class="brand-sub" id="app-logo-title">10-Week Portal</span>
                </div>
            </div>

            <!-- Header Middle: Week Selector & View Mode -->
            <div class="header-center">
                <!-- Scalable 10-Week Selector Dropdown -->
                <div class="custom-select-wrapper">
                    <span class="select-icon">📅</span>
                    <select id="week-select-dropdown" class="custom-select" onchange="switchWeek(this.value)">
                        <option value="1">Week 1: Morphology & Language</option>
                        <option value="2">Week 2: Semiotics & Anatomy</option>
                        <option value="3" selected>Week 3: Nomads' Culture & Proto-Turkic Heritage</option>
                        <option value="4" disabled>🔒 Week 4 (Upcoming)</option>
                        <option value="5" disabled>🔒 Week 5 (Upcoming)</option>
                        <option value="6" disabled>🔒 Week 6 (Upcoming)</option>
                        <option value="7" disabled>🔒 Week 7 (Upcoming)</option>
                        <option value="8" disabled>🔒 Week 8 (Upcoming)</option>
                        <option value="9" disabled>🔒 Week 9 (Upcoming)</option>
                        <option value="10" disabled>🔒 Week 10 (Upcoming)</option>
                        <option value="all">🔥 Full Course Mega-Test</option>
                    </select>
                </div>

                <!-- Main View Toggle -->
                <div class="view-toggle-group">
                    <button class="view-btn active" id="tab-quiz" onclick="switchMainView('quiz')">
                        <span class="btn-icon">⚡</span> <span id="txt-tab-quiz">Quiz Trainer</span>
                    </button>
                    <button class="view-btn highlight-btn" id="tab-main" onclick="switchMainView('main')">
                        <span class="btn-icon">📖</span> <span id="txt-tab-main">Master Textbook</span>
                    </button>
                </div>
            </div>

            <!-- Header Right: AI Assistant & Language Switcher -->
            <div class="header-right">
                <!-- AI Quick Answer Trigger Button -->
                <button class="ai-trigger-btn" onclick="toggleAiDrawer()">
                    <span class="ai-sparkle">🤖</span>
                    <span id="txt-ai-btn">AI Exam Assistant</span>
                </button>

                <!-- Instant Segmented Language Switcher -->
                <div class="lang-segmented-control">
                    <button class="lang-segment active" id="lang-ru" onclick="switchLanguage('ru')">RU</button>
                    <button class="lang-segment" id="lang-en" onclick="switchLanguage('en')">EN</button>
                </div>
            </div>
        </div>
    </header>

    <!-- Floating AI Oral Answer Drawer (Mobile Bottom Sheet) -->
    <div class="ai-drawer" id="ai-drawer">
        <div class="ai-drawer-header">
            <div class="ai-title">
                <span class="ai-icon">🤖</span>
                <div>
                    <h3>AI Oral Exam Helper</h3>
                    <p id="ai-subtitle">Direct English oral exam answer</p>
                </div>
            </div>
            <button class="ai-close-btn" onclick="toggleAiDrawer()">✕</button>
        </div>
        
        <div class="ai-drawer-body">
            <div class="ai-input-group">
                <textarea id="ai-prompt-input" rows="2" placeholder="Задайте вопрос учителя (напр. 'В чем суть Cultura Animi Цицерона?')..."></textarea>
                <button class="ai-submit-btn" id="ai-submit-btn" onclick="askAiAssistant()">
                    <span>⚡ Получить ответ из лекций</span>
                </button>
            </div>

            <!-- Output Box -->
            <div class="ai-output-box" id="ai-output-box" style="display: none;">
                <div class="ai-status" id="ai-status-indicator">✨ Direct English Answer:</div>
                <div class="ai-response-text" id="ai-response-text"></div>
                <button class="ai-copy-btn" onclick="copyAiResponse()">📋 Copy Text</button>
            </div>
        </div>
    </div>

    <!-- Main Container -->
    <main class="main-content">
        <div class="content-wrapper">

            <!-- Controls & Selector Bar (For Quiz Mode) -->
            <div class="control-panel" id="quiz-control-panel">
                <div class="mode-selector">
                    <span class="panel-icon">🎯</span>
                    <label for="q-count-select" id="lbl-q-mode">Questions Mode:</label>
                    <div class="custom-select-wrapper small-select">
                        <select id="q-count-select" class="custom-select" onchange="changeQuestionCount(this.value)">
                            <option value="10" selected>10 Questions</option>
                            <option value="30">30 Questions</option>
                            <option value="50">50 Questions</option>
                            <option value="100">100 Questions (Mega Mode)</option>
                        </select>
                    </div>
                </div>
                <button class="reset-btn" id="btn-restart" onclick="resetCurrentQuiz()">
                    <span class="btn-icon">🔄</span> Restart Test
                </button>
            </div>

            <!-- Stats Bar (For Quiz Mode) -->
            <div class="stats-bar" id="quiz-stats-bar">
                <div class="stat-card">
                    <span class="stat-label" id="lbl-active-test">Active Test</span>
                    <span class="stat-value" id="quiz-title">Week 1: Morphology & Language</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label" id="lbl-score">Score</span>
                    <span class="stat-value highlight-cyan" id="score-counter">0 / 10</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label" id="lbl-accuracy">Accuracy</span>
                    <span class="stat-value highlight-purple" id="accuracy-counter">100%</span>
                </div>
            </div>

            <!-- Progress Bar (For Quiz Mode) -->
            <div class="progress-container" id="quiz-progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>

            <!-- Quiz Questions Container -->
            <div class="quiz-container" id="quiz-container">
                <!-- Dynamically populated by JS -->
            </div>

            <!-- Master Study Guide Reader Container (For Main Mode) -->
            <div class="reader-container" id="reader-container" style="display: none;">
                <!-- Book Navigation Bar -->
                <div class="book-nav-bar">
                    <div class="reader-controls">
                        <button class="reader-btn active" id="btn-read-week1" onclick="loadReaderWeek(1)">
                            <span>📘 Week 1 Textbook</span>
                        </button>
                        <button class="reader-btn" id="btn-read-week2" onclick="loadReaderWeek(2)">
                            <span>📙 Week 2 Textbook</span>
                        </button>
                        <button class="reader-btn" id="btn-read-week3" onclick="loadReaderWeek(3)">
                            <span>📗 Week 3 Textbook</span>
                        </button>
                    </div>

                    <!-- Chapter Flip Controls -->
                    <div class="chapter-flip-controls">
                        <button class="flip-btn" onclick="prevChapter()">◄ <span id="lbl-prev-chap">Назад</span></button>
                        <div class="custom-select-wrapper small-select">
                            <select id="chapter-select-dropdown" class="custom-select" onchange="jumpToChapter(this.value)">
                                <!-- Dynamically populated by JS -->
                            </select>
                        </div>
                        <button class="flip-btn" onclick="nextChapter()"><span id="lbl-next-chap">Вперед</span> ►</button>
                        <button class="flip-btn show-all-btn" onclick="showFullBook()"><span id="lbl-all-chap">Весь текст</span></button>
                    </div>
                </div>

                <!-- Reader Text Box -->
                <div class="reader-content card-glass" id="reader-text-area">
                    <!-- Master Guide Content dynamically rendered chapter by chapter -->
                </div>
            </div>

        </div>
    </main>

    <footer class="app-footer">
        <p>Astana IT University • Cultural Studies AI Exam Portal • Summer Trimester 2026</p>
    </footer>

    <!-- ЕДИНСТВЕННЫЙ источник данных учебника. Второй <script> с js/app.js подключать нельзя:
         оба файла объявляют const fullBookDatabase, и повторное объявление роняет скрипт. -->
    <script src="website/js/app.js?v=20260728_8"></script>
</body>
</html>
